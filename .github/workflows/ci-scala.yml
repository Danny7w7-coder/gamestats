# CI del módulo de análisis (Scala).
name: CI Scala

on:
  push:
    branches: [scala, main]
    paths:
      - "analytics-scala/**"
      - "contracts/**" # los tests leen los fixtures de contracts/fixtures
      - ".github/workflows/ci-scala.yml"
  pull_request:
    paths:
      - "analytics-scala/**"
      - "contracts/**"
      - ".github/workflows/ci-scala.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-scala

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: sbt test
        run: sbt -batch test

      - name: sbt assembly
        run: sbt -batch assembly

      - name: docker build
        run: docker build -t gamestats-analytics .
